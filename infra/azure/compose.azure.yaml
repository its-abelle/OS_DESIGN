services:
  minio:
    ports: !override []
    restart: unless-stopped
  database:
    restart: unless-stopped
  backend:
    restart: unless-stopped
  frontend:
    ports: !override []
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
    ports: ["80:80", "443:443", "9443:9443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_started }
      minio: { condition: service_started }
volumes:
  caddy_data: {}
  caddy_config: {}
