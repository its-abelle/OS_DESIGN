ServerName localhost
ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteRule ^api(?:/.*)?$ /api.php [END,QSA]
</Directory>

# The proxy supplies all public HTTP traffic. PHP source and dependencies live
# outside DocumentRoot; only the page, assets and API entry script are public.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
