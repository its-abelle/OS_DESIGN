services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # minio/minio left Docker Hub; maintained fork
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports: ["9100:9000", "9101:9001"]   # host 9000/9001 taken by another project; 9100 must be browser-reachable
    volumes: [minio_data:/data]

  database:   # STUB: schema only, not wired to backend yet
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data, ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    restart: on-failure   # ensureBucket gives up after ~20s if MinIO isn't ready
    depends_on:
      minio: { condition: service_started }
      database: { condition: service_healthy }

  frontend:   # STUB: nginx + placeholder page
    image: nginx:stable-alpine
    ports: ["8080:80"]
    environment: { MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}" }   # same value the backend enforces
    volumes:
      - ./frontend/templates:/etc/nginx/templates:ro
      - ./frontend/15-upload-limit.envsh:/docker-entrypoint.d/15-upload-limit.envsh:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on: [backend]

volumes: { minio_data: {}, pgdata: {} }
